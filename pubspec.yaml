name: fashion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  onesignal_flutter: ^5.2.0

  razorpay_flutter: ^1.3.7

  # Icons
  cupertino_icons: ^1.0.2

  # Network / API
  http: ^1.2.2

  # Local Storage
  shared_preferences: ^2.5.5

  # Image Picker
  image_picker: ^1.1.2

  # WebView
  webview_flutter: ^4.7.0

  # Open URLs
  url_launcher: ^6.2.5

  # UI / Visibility
  visibility_detector: ^0.4.0+2

  # Location
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  location: ^10.0.2

  # Google Maps
  google_maps_flutter: ^2.9.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Voice Recording / Playback
  record: 6.2.1
  path_provider: ^2.1.4
  audioplayers: ^6.1.0

  # PDF Generation / Printing
  pdf: ^3.11.1
  printing: ^5.13.1
  public_file_saver: ^1.2.0
  sendotp_flutter_sdk: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/catering/
    - assets/catering/uploads/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app.png"
  min_sdk_android: 21